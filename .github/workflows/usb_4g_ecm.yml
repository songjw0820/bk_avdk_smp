name: Firmware (usb_4g_ecm)

on:
  push:
    branches: [feature/usb-4g-ecm-at]
  pull_request:
    branches: [feature/usb-4g-ecm-at]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pull Armino build image
        run: docker pull bekencorp/armino-idk:1.5

      - name: Build bk7259 multimedia/usb_4g_ecm
        run: |
          docker run --rm -v "$PWD":/armino -w /armino \
            -u "$(id -u):$(id -g)" -e HOME=/tmp \
            bekencorp/armino-idk:1.5 \
            make bk7259 PROJECT=multimedia/usb_4g_ecm

      - name: List package outputs
        if: always()
        run: ls -la build/bk7259/*/package || true

      - uses: actions/upload-artifact@v4
        with:
          name: usb_4g_ecm-bk7259
          path: build/bk7259/usb_4g_ecm*/package/
          if-no-files-found: error
